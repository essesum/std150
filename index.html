<style>
:root{color-scheme:dark;--bg:#0A0F24;--bg2:#10183A;--fg:#ECE5D4;--mute:#9DA3BC;--gold:#CFA850;--gold2:#E9CF8A;--crit:#E0635A;--line:rgba(207,168,80,.28)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#1A2552 0%,var(--bg) 60%);color:var(--fg);font:15px/1.5 "Golos Text",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:400px;display:grid;gap:18px;text-align:center}
.eyebrow{font:500 11px/1 "Golos Text",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1{font:400 clamp(44px,12vw,64px)/.95 "Forum","Times New Roman",serif;margin:0}
h1 em{font-style:normal;color:var(--gold2)}
p{margin:0;color:var(--mute);font-size:14px}
form{display:grid;gap:10px;margin-top:8px}
input[type=password]{width:100%;padding:13px 14px;border-radius:4px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:16px "Golos Text",sans-serif;text-align:center;letter-spacing:.04em}
input[type=password]:focus{outline:2px solid var(--gold2);outline-offset:1px}
button{padding:13px 14px;border-radius:4px;border:0;background:var(--gold);color:#1A1405;font:500 15px "Golos Text",sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px;color:var(--mute)}
input[type=checkbox]{accent-color:var(--gold)}
.err{color:var(--crit);font-size:13px;min-height:1.2em}
.rule{height:1px;background:var(--line);margin:4px 30%}
</style>
</head>

<script>
(function(){
  const P=JSON.parse(document.getElementById('payload').textContent);
  const b64=s=>{const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
  // Ключ привязан к соли сайта (kid), а не к сборке: после публикации обновлений пароль заново не спрашивается.
  const KID=P.kid||P.v, KEY='std150_key_'+KID, SKEY='std150_raw_'+KID;
  const toB64=async k=>{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',k));let s='';raw.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
  async function derive(pw){
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  }
  async function open(key){
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
    const html=new TextDecoder().decode(buf);
    try{sessionStorage.setItem(SKEY,await toB64(key))}catch(_){}
    window.__STD_KEY=key;window.__STD_KID=KID;
    document.open();document.write(html);document.close();
    window.__STD_KEY=key;window.__STD_KID=KID;
  }
  async function tryStored(){
    let raw=null;try{raw=sessionStorage.getItem(SKEY)||localStorage.getItem(KEY)}catch(e){}
    if(!raw)return;
    try{const k=await crypto.subtle.importKey('raw',b64(raw),{name:'AES-GCM'},true,['decrypt']);await open(k)}
    catch(e){try{localStorage.removeItem(KEY);sessionStorage.removeItem(SKEY)}catch(_){}}
  }
  const f=document.getElementById('f'),btn=document.getElementById('go'),err=document.getElementById('err');
  f.addEventListener('submit',async e=>{
    e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Открываю…';
    try{
      const k=await derive(document.getElementById('pw').value);
      if(document.getElementById('rem').checked){
        try{localStorage.setItem(KEY,await toB64(k))}catch(_){}
      }
      await open(k);
    }catch(x){err.textContent='Пароль не подошёл. Проверь раскладку и попробуй ещё раз.';btn.disabled=false;btn.textContent='Открыть'}
  });
  if(!window.crypto||!crypto.subtle){err.textContent='Браузер не поддерживает шифрование. Открой страницу по https в свежем Chrome, Safari или Firefox.'}
  // document.open() во время парсинга не заменяет документ, а дописывает в него — ждём конца загрузки.
  else if(document.readyState==='complete')tryStored();
  else window.addEventListener('load',()=>setTimeout(tryStored,0),{once:true});
})();
</script>
